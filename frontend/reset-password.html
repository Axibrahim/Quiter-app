<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238d7cff' stroke-width='2'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M12 3a9 9 0 0 1 0 18M3 12h18'/%3E%3C/svg%3E" />
  <title>Reset your password — Quiter</title>
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
</head>
<body style="background: var(--bg); display:flex; align-items:center; justify-content:center; min-height:100vh;">
  <div class="liquid-glass liquid-glass--panel" style="border-radius: var(--radius-lg); padding: var(--space-4); max-width: 420px; width:100%;">
    <h1 class="h3" style="margin-bottom: var(--space-2);">Set a new password</h1>

    <form id="reset-form">
      <div class="modal__field">
        <label for="reset-password">New password</label>
        <input type="password" id="reset-password" placeholder="At least 10 characters" autocomplete="new-password" required />
      </div>
      <p class="modal__error" id="reset-error"></p>
      <button class="btn btn--solid modal__submit" type="submit">Reset password</button>
    </form>

    <div id="reset-success" style="display:none; text-align:center;">
      <p style="color: var(--accent-teal); margin-bottom: var(--space-2);">Password updated.</p>
      <a href="index.html?auth=login" class="liquid-glass btn btn--glass">Log in now</a>
    </div>
  </div>
  <script type="module" src="assets/js/reset-password.js"></script>
</body>
</html>
