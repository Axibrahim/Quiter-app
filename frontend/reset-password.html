<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/layout.css">
<meta name="robots" content="noindex">
<title>Reset password — Quiter</title>
</head>
<body>
<main class="page page--tiny page--center">
  <div class="wrap">
    <div class="group liquid-glass liquid-glass--panel">
      <h1 class="h3" style="margin-bottom:1.2rem">Choose a new password</h1>
      <form id="reset-form" novalidate>
        <div class="field"><label for="reset-password">New password</label><input type="password" id="reset-password" placeholder="At least 10 characters" autocomplete="new-password" required></div>
        <p class="error" id="reset-error" role="alert"></p>
        <button class="btn btn--solid" type="submit" style="width:100%">Reset password</button>
      </form>
      <div id="reset-success" hidden style="text-align:center;display:none">
        <p class="success" style="margin-bottom:1rem">Password updated.</p>
        <a href="index.html?auth=login" class="btn btn--solid">Log in</a>
      </div>
    </div>
  </div>
</main>
<script type="module">
  import { initShell } from './assets/js/modules/shell.js';
  import './assets/js/reset-password.js';
  initShell({ auth: 'none' });
</script>
</body>
</html>
