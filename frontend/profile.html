<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/layout.css">
<title>Profile — Quiter</title>
</head>
<body>
<main class="page page--tiny">
  <div class="wrap">
    <div class="page-head"><p class="eyebrow">Account</p><h1 class="h2">Your <em>profile</em></h1></div>
    <div class="group liquid-glass liquid-glass--panel">
      <div class="warning" id="verify-banner" hidden style="justify-content:space-between;align-items:center">
        <p>Your email isn't verified yet.</p>
        <button class="btn btn--glass liquid-glass btn--sm" id="resend-verify-btn" type="button">Resend</button>
      </div>
      <form id="profile-form" novalidate>
        <div class="field"><label for="p-name">Display name</label><input type="text" id="p-name" disabled><p class="field__hint">Name changes aren't available yet.</p></div>
        <div class="field"><label for="p-email">Email</label><input type="email" id="p-email" autocomplete="email" required></div>
        <div class="field"><label for="p-new">New password <span class="optional">leave blank to keep</span></label><input type="password" id="p-new" placeholder="At least 10 characters" autocomplete="new-password"></div>
        <div class="field"><label for="p-current">Current password <span class="optional">required to save</span></label><input type="password" id="p-current" autocomplete="current-password" required></div>
        <p class="error" id="p-error" role="alert"></p>
        <p class="success" id="p-success" role="status"></p>
        <button class="btn btn--solid" type="submit" style="width:100%">Save changes</button>
      </form>
    </div>
  </div>
</main>
<script type="module">
  import { initShell } from './assets/js/modules/shell.js';
  import { initProfile } from './assets/js/profile.js';
  initShell({ auth: 'required' }).then((u) => u && initProfile(u));
</script>
</body>
</html>
