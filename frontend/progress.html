<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/layout.css">
<title>Progress — Quiter</title>
</head>
<body>
<main class="page page--narrow">
  <div class="wrap">
    <a class="back" href="dashboard.html">← Dashboard</a>
    <div class="progress-head" style="margin-top:1rem">
      <div><p class="eyebrow" id="p-kind"></p><h1 class="h2" id="p-title">Progress</h1></div>
    </div>
    <p class="error" id="p-error" role="alert"></p>

    <div class="stats">
      <div class="stat liquid-glass liquid-glass--panel"><p class="stat__label">Day</p><p class="stat__value" id="s-day">–</p></div>
      <div class="stat liquid-glass liquid-glass--panel"><p class="stat__label">Streak</p><p class="stat__value" id="s-streak">–</p></div>
      <div class="stat liquid-glass liquid-glass--panel"><p class="stat__label">Best</p><p class="stat__value" id="s-best">–</p></div>
    </div>

    <div class="warning" id="quit-warning" hidden><span aria-hidden="true">⚠</span><p id="quit-warning-text"></p></div>

    <section class="panel liquid-glass liquid-glass--panel">
      <h2 class="panel__title">Last 30 days</h2>
      <div class="heatmap" id="heatmap" role="img" aria-label="30-day check-in calendar"></div>
      <div class="legend"><span><i style="background:var(--accent-teal)"></i>Done</span><span><i style="background:var(--accent-gold)"></i>Partial</span><span><i style="background:var(--accent-ember)"></i>Missed</span><span><i style="background:rgba(255,255,255,.12)"></i>No entry</span></div>
    </section>

    <section class="panel liquid-glass liquid-glass--panel" id="coach-panel" hidden>
      <h2 class="panel__title">Blue's notes</h2>
      <ul class="diagnosis" id="diagnosis"></ul>
    </section>

    <section class="panel liquid-glass liquid-glass--panel" id="weekday-panel" hidden>
      <h2 class="panel__title">Your strongest days</h2>
      <div class="weekdays" id="weekdays"></div>
    </section>

    <section class="panel liquid-glass liquid-glass--panel" id="ex-panel" hidden>
      <h2 class="panel__title" id="ex-title">Your numbers</h2>
      <div class="ex-cards" id="ex-cards"></div>
    </section>

    <section class="panel liquid-glass liquid-glass--panel" id="video" hidden>
      <div class="panel__head">
        <h2 class="panel__title">10-second video check-ins <span class="optional">Optional</span></h2>
        <div class="seg" role="radiogroup" aria-label="Video check-in frequency" id="video-seg">
          <label><input type="radio" name="vfreq" value="" checked><span>Off</span></label>
          <label><input type="radio" name="vfreq" value="weekly"><span>Weekly</span></label>
          <label><input type="radio" name="vfreq" value="monthly"><span>Monthly</span></label>
        </div>
      </div>
      <p class="video-state" id="video-state"></p>
      <div class="recorder" id="recorder" hidden>
        <div id="rec-idle"><button class="btn btn--glass liquid-glass rec-btn" type="button" id="rec-start"><span class="rec-dot"></span>Record 10 seconds</button></div>
        <div id="rec-active" hidden><video id="rec-preview" autoplay muted playsinline></video><p class="countdown" id="rec-count"></p>
          <div class="recorder__actions"><button class="btn btn--glass liquid-glass btn--sm" type="button" id="rec-stop">Stop now</button><button class="btn btn--text btn--sm" type="button" id="rec-cancel">Cancel</button></div></div>
        <div id="rec-review" hidden><video id="rec-review-video" controls playsinline></video>
          <div class="recorder__actions"><button class="btn btn--solid btn--sm" type="button" id="rec-save">Save check-in</button><button class="btn btn--text btn--sm" type="button" id="rec-discard">Discard</button></div></div>
      </div>
      <p class="error" id="video-error" role="alert"></p>
      <div class="gallery" id="gallery"></div>
    </section>

    <div style="margin-top:var(--space-3)">
      <button class="btn btn--exit" type="button" id="exit-btn" aria-live="polite" aria-atomic="true" style="width:100%" hidden>Exit plan</button>
    </div>
  </div>
</main>
<script type="module">
  import { initShell } from './assets/js/modules/shell.js';
  import { initProgress } from './assets/js/progress.js';
  initShell({ active: 'dashboard', auth: 'required' }).then((u) => u && initProgress());
</script>
</body>
</html>
