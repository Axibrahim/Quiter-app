<main class="page page--narrow">
  <div class="wrap">
    <a class="back" href="plans.html">← Back</a>
    <div class="page-head">
      <p class="eyebrow">Personal plan</p>
      <h1 class="h2">What do you want <em>to achieve?</em></h1>
      <p>Describe it in your own words. Blue does the rest.</p>
    </div>
    <form id="plan-form" novalidate>
      <section class="group liquid-glass liquid-glass--panel">
        <p class="group__label">Your goal</p>
        <div class="field" style="margin:0">
          <label for="goal">Goal <span class="counter" id="goal-count">0 / 120</span></label>
          <textarea id="goal" maxlength="120" placeholder="e.g. Finish my thesis draft, learn guitar, launch my shop…" required></textarea>
        </div>
      </section>
      <div id="common"></div>
      <p class="error" id="form-error" role="alert"></p>
      <button class="btn btn--solid" type="submit" id="submit" style="width:100%">Create my plan</button>
    </form>
  </div>
</main>
