<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/layout.css">
<title>Personal plan — Quiter</title>
</head>
<body>
<main class="page page--narrow">
  <div class="wrap">
    <a class="back" href="plans.html">← Back</a>
    <div class="page-head">
      <p class="eyebrow">Personal plan</p>
      <h1 class="h2">What do you want <em>to achieve?</em></h1>
      <p>Describe it in your own words. Your coach does the rest.</p>
    </div>
    <form id="plan-form" novalidate>
      <section class="group liquid-glass liquid-glass--panel">
        <p class="group__label">Your goal</p>
        <div class="field" style="margin:0">
          <label for="goal">Goal <span class="counter" id="goal-count">0 / 120</span></label>
          <textarea id="goal" maxlength="120" placeholder="e.g. Finish my thesis draft, learn guitar, launch my shop…" required></textarea>
        </div>
      </section>
      <div id="common"></div>
      <p class="error" id="form-error" role="alert"></p>
      <button class="btn btn--solid" type="submit" id="submit" style="width:100%">Create my plan</button>
    </form>
  </div>
</main>
<script type="module">
  import { initShell } from './assets/js/modules/shell.js';
  import './assets/js/custom-plan.js';
  initShell({ active: 'plans', auth: 'required' });
</script>
</body>
</html>
