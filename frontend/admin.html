<body>
<main class="page">
    <div class="progress-head">
      <div>
        <p class="eyebrow">Admin</p>
        <h1 class="h2">Manage plan templates</h1>
      </div>
      <button class="btn btn--glass liquid-glass" id="new-template-btn" type="button">+ New plan</button>
    </div>

    <!-- ============================= TEMPLATE FORM ============================= -->
    <div class="group liquid-glass liquid-glass--panel" style="display:none" id="template-form-panel">
      <h3 class="h3" id="template-form-title" style="margin-bottom: var(--space-3);">New plan</h3>

      <form id="template-form">
        <div class="group liquid-glass liquid-glass--panel">
          <p class="group__label">Basics</p>

          <div class="field">
            <label for="tpl-title">Title</label>
            <input id="tpl-title" type="text" maxlength="120" required />
          </div>

          <div class="field">
            <label for="tpl-slug">Slug (used in the image path, no spaces)</label>
            <input id="tpl-slug" type="text" maxlength="80" pattern="[a-z0-9\-]+" required />
          </div>

          <div class="field">
            <label for="tpl-identity">Identity statement</label>
            <input id="tpl-identity" type="text" maxlength="160" required />
          </div>

          <div class="field">
            <label>Direction</label>
            <div class="radio-row">
              <label><input type="radio" name="tpl-direction" value="break" checked /><span>Break a habit</span></label>
              <label><input type="radio" name="tpl-direction" value="build" /><span>Build a habit</span></label>
            </div>
          </div>

          <div class="field">
            <label for="tpl-category">Category</label>
            <input id="tpl-category" type="text" maxlength="60" placeholder="e.g. fitness, smoking, sleep" required />
          </div>

          <div class="field">
            <label for="tpl-length">Length (days)</label>
            <input id="tpl-length" type="number" min="3" max="365" value="30" required />
          </div>

          <div class="field">
            <label for="tpl-description">Description <span class="optional">Optional</span></label>
            <textarea id="tpl-description" maxlength="2000"></textarea>
          </div>
        </div>

        <div class="group liquid-glass liquid-glass--panel">
          <p class="group__label">Photo</p>

          <div class="field">
            <label for="tpl-photo-file">Upload a photo</label>
            <input id="tpl-photo-file" type="file" accept="image/jpeg,image/png,image/webp" />
            <p class="field__hint" id="tpl-photo-status"></p>
          </div>

          <div id="tpl-photo-preview-wrap" style="display:none; margin-top: var(--space-2);">
            <img id="tpl-photo-preview" style="width: 100%; max-width: 320px; border-radius: var(--radius-lg); display:block;" alt="" />
          </div>
          <input type="hidden" id="tpl-photo-url" />
        </div>

        <div class="group liquid-glass liquid-glass--panel">
          <p class="group__label">Pricing</p>

          <div class="field">
            <label for="tpl-price">Price (USD) <span class="optional">Optional — leave blank for free</span></label>
            <input id="tpl-price" type="number" min="0" step="0.01" placeholder="e.g. 9.99" />
          </div>

          <div class="field">
            <label for="tpl-trial">Free trial (days) <span class="optional">Optional</span></label>
            <input id="tpl-trial" type="number" min="0" max="90" placeholder="e.g. 7" />
          </div>
          
        <div class="field">
            <label class="q-check">
              <input type="checkbox" id="tpl-active" checked /><span class="q-check__box"></span>
              <span>Active (visible in the public catalog)</span>
            </label>
            </div>
        </div>

        <div class="group liquid-glass liquid-glass--panel">
          <p class="group__label">Hero swiper content</p>
          <p class="field__hint">These show on the big swiping banner at the top of the Plans page.</p>

          <div class="field">
            <label for="tpl-tagline">Tagline <span class="optional">Optional — e.g. "THE FIST. THE FREEDOM."</span></label>
            <input id="tpl-tagline" type="text" maxlength="120" />
          </div>

          <div class="field">
            <label for="tpl-cta">CTA button text <span class="optional">Defaults to "Start Your Journey"</span></label>
            <input id="tpl-cta" type="text" maxlength="40" placeholder="Start Your Journey" />
          </div>

          <div class="field">
            <label for="tpl-age-rating">Age rating <span class="optional">Optional — e.g. "18+"</span></label>
            <input id="tpl-age-rating" type="text" maxlength="10" placeholder="18+" />
          </div>

          <div class="field">
            <label class="q-check">
              <input type="checkbox" id="tpl-included" checked /><span class="q-check__box"></span>
              <span>Show "Included with Quiter" badge</span>
            </label>
          </div>
        </div>
        </div>

        <p class="error" id="tpl-error"></p>

        <div style="display: flex; gap: var(--space-2);">
          <button class="btn btn--solid" type="submit" id="tpl-submit">Save plan</button>
          <button class="btn btn--glass liquid-glass" type="button" id="tpl-cancel">Cancel</button>
        </div>
      </form>
    </div>

    <!-- ============================= TEMPLATE LIST ============================= -->
    <p id="admin-loading" class="lede">Loading plan templates…</p>
    <div class="admin-grid" id="admin-template-grid"></div>
  </main>
<script type="module">
  import { initShell } from './assets/js/modules/shell.js';
  import { initAdmin } from './assets/js/admin.js';
  initShell({ active: 'admin', auth: 'required' }).then((u) => u && initAdmin(u));
</script>
