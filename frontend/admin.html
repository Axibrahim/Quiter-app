<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238d7cff' stroke-width='2'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M12 3a9 9 0 0 1 0 18M3 12h18'/%3E%3C/svg%3E" />
  <title>Admin — Quiter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
</head>
<body style="background: var(--bg);">

  <header class="nav wrap" style="position: sticky; top: 0;">
    <div class="liquid-glass nav__pill">
      <div class="nav__left">
        <a href="index.html" class="nav__mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18M3 12h18"/></svg>
          Quiter
        </a>
        <nav class="nav__links">
          <a href="plans.html">Plans</a>
          <a href="dashboard.html">Dashboard</a>
        </nav>
      </div>
      <div class="nav__right" id="nav-auth-slot"></div>
    </div>
  </header>

  <main class="wrap section" style="padding-top: var(--space-3);">
    <div class="section__head">
      <div>
        <p class="eyebrow">Admin</p>
        <h1 class="h2">Manage plan templates</h1>
      </div>
      <button class="liquid-glass btn btn--glass" id="new-template-btn" type="button">+ New plan</button>
    </div>

    <!-- ============================= TEMPLATE FORM ============================= -->
    <div class="liquid-glass liquid-glass--panel" style="padding: var(--space-4); margin-bottom: var(--space-4); display: none;" id="template-form-panel">
      <h3 class="h3" id="template-form-title" style="margin-bottom: var(--space-3);">New plan</h3>

      <form id="template-form">
        <div class="liquid-glass custom-plan__group">
          <p class="custom-plan__group-label">Basics</p>

          <div class="modal__field">
            <label for="tpl-title">Title</label>
            <input id="tpl-title" type="text" maxlength="120" required />
          </div>

          <div class="modal__field">
            <label for="tpl-slug">Slug (used in the image path, no spaces)</label>
            <input id="tpl-slug" type="text" maxlength="80" pattern="[a-z0-9\-]+" required />
          </div>

          <div class="modal__field">
            <label for="tpl-identity">Identity statement</label>
            <input id="tpl-identity" type="text" maxlength="160" required />
          </div>

          <div class="modal__field">
            <label>Direction</label>
            <div class="modal__radio-row">
              <label><input type="radio" name="tpl-direction" value="break" checked /><span>Break a habit</span></label>
              <label><input type="radio" name="tpl-direction" value="build" /><span>Build a habit</span></label>
            </div>
          </div>

          <div class="modal__field">
            <label for="tpl-category">Category</label>
            <input id="tpl-category" type="text" maxlength="60" placeholder="e.g. fitness, smoking, sleep" required />
          </div>

          <div class="modal__field">
            <label for="tpl-length">Length (days)</label>
            <input id="tpl-length" type="number" min="3" max="365" value="30" required />
          </div>

          <div class="modal__field">
            <label for="tpl-description">Description <span class="custom-plan__optional">Optional</span></label>
            <textarea id="tpl-description" maxlength="2000"></textarea>
          </div>
        </div>

        <div class="liquid-glass custom-plan__group">
          <p class="custom-plan__group-label">Photo</p>

          <div class="modal__field">
            <label for="tpl-photo-file">Upload a photo</label>
            <input id="tpl-photo-file" type="file" accept="image/jpeg,image/png,image/webp" />
            <p class="custom-plan__hint" id="tpl-photo-status"></p>
          </div>

          <div id="tpl-photo-preview-wrap" style="display:none; margin-top: var(--space-2);">
            <img id="tpl-photo-preview" style="width: 100%; max-width: 320px; border-radius: var(--radius-lg); display:block;" alt="" />
          </div>
          <input type="hidden" id="tpl-photo-url" />
        </div>

        <div class="liquid-glass custom-plan__group">
          <p class="custom-plan__group-label">Pricing</p>

          <div class="modal__field">
            <label for="tpl-price">Price (USD) <span class="custom-plan__optional">Optional — leave blank for free</span></label>
            <input id="tpl-price" type="number" min="0" step="0.01" placeholder="e.g. 9.99" />
          </div>

          <div class="modal__field">
            <label for="tpl-trial">Free trial (days) <span class="custom-plan__optional">Optional</span></label>
            <input id="tpl-trial" type="number" min="0" max="90" placeholder="e.g. 7" />
          </div>
          
        <div class="modal__field">
            <label class="custom-plan__reminder-label" style="width: fit-content;">
              <input type="checkbox" id="tpl-active" checked />
              <span>Active (visible in the public catalog)</span>
            </label>
            </div>
        </div>

        <div class="liquid-glass custom-plan__group">
          <p class="custom-plan__group-label">Hero swiper content</p>
          <p class="custom-plan__hint">These show on the big swiping banner at the top of the Plans page.</p>

          <div class="modal__field">
            <label for="tpl-tagline">Tagline <span class="custom-plan__optional">Optional — e.g. "THE FIST. THE FREEDOM."</span></label>
            <input id="tpl-tagline" type="text" maxlength="120" />
          </div>

          <div class="modal__field">
            <label for="tpl-cta">CTA button text <span class="custom-plan__optional">Defaults to "Start Your Journey"</span></label>
            <input id="tpl-cta" type="text" maxlength="40" placeholder="Start Your Journey" />
          </div>

          <div class="modal__field">
            <label for="tpl-age-rating">Age rating <span class="custom-plan__optional">Optional — e.g. "18+"</span></label>
            <input id="tpl-age-rating" type="text" maxlength="10" placeholder="18+" />
          </div>

          <div class="modal__field">
            <label class="custom-plan__reminder-label" style="width: fit-content;">
              <input type="checkbox" id="tpl-included" checked />
              <span>Show "Included with Quiter" badge</span>
            </label>
          </div>
        </div>
        </div>

        <p class="modal__error" id="tpl-error"></p>

        <div style="display: flex; gap: var(--space-2);">
          <button class="btn btn--solid modal__submit" type="submit" id="tpl-submit">Save plan</button>
          <button class="liquid-glass btn btn--glass" type="button" id="tpl-cancel">Cancel</button>
        </div>
      </form>
    </div>

    <!-- ============================= TEMPLATE LIST ============================= -->
    <p id="admin-loading" class="lede">Loading plan templates…</p>
    <div id="admin-template-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem;"></div>
  </main>

  <footer class="footer wrap">
    <span>© 2026 Quiter. Built to be quit — one habit at a time.</span>
    <span>Privacy · Terms · Contact</span>
  </footer>

  <script src="assets/js/mobile-nav.js"></script>
  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
