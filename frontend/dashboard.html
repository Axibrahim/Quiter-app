<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/layout.css">
<title>Dashboard — Quiter</title>
</head>
<body>
<main class="page page--narrow">
  <div class="wrap">
    <div class="dash-head">
      <div>
        <p class="eyebrow" id="today-date"></p>
        <h1 class="h2" id="greeting">Today</h1>
      </div>
      <a class="btn btn--solid" href="plans.html" id="new-plan">+ New plan</a>
    </div>
    <p class="error" id="dash-error" role="alert"></p>
    <div class="plans" id="plans" aria-live="polite"></div>
  </div>
</main>
<script type="module">
  import { initShell } from './assets/js/modules/shell.js';
  import { initDashboard } from './assets/js/dashboard.js';
  initShell({ active: 'dashboard', auth: 'required' }).then((user) => user && initDashboard(user));
</script>
</body>
</html>
